<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SENTINEL — Check In</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --navy-deep: #0a0e1a;
    --navy: #111827;
    --navy-light: #1a2332;
    --slate: #1e293b;
    --slate-light: #334155;
    --slate-text: #94a3b8;
    --text: #e2e8f0;
    --text-bright: #f8fafc;
    --amber: #f59e0b;
    --amber-glow: rgba(245, 158, 11, 0.3);
    --amber-dim: rgba(245, 158, 11, 0.12);
    --green: #22c55e;
    --green-dim: rgba(34, 197, 94, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--navy-deep);
    color: var(--text);
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    overflow: hidden;
    max-width: 430px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    padding: 16px 20px 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .back-btn {
    width: 36px; height: 36px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    cursor: pointer;
    color: var(--text);
  }
  .header-title {
    font-size: 16px; font-weight: 600;
    color: var(--text-bright);
  }
  .header-right { width: 36px; } /* spacing balance */

  /* Main Content */
  .main {
    flex: 1; overflow-y: auto;
    padding: 20px 20px 80px;
    display: flex; flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .status-icon {
    width: 100px; height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--amber) 0%, #d97706 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 48px;
    margin-bottom: 24px;
    box-shadow: 0 8px 32px var(--amber-glow);
    animation: iconPulse 3s ease-in-out infinite;
  }
  @keyframes iconPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 8px 32px var(--amber-glow); }
    50% { transform: scale(1.03); box-shadow: 0 12px 40px var(--amber-glow); }
  }

  .main-title {
    font-size: 26px; font-weight: 700;
    color: var(--text-bright);
    margin-bottom: 8px;
  }

  .main-subtitle {
    font-size: 14px; color: var(--slate-text);
    margin-bottom: 32px;
    font-family: 'JetBrains Mono', monospace;
  }

  .info-card {
    background: var(--slate);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 16px;
    width: 100%;
    max-width: 340px;
    text-align: left;
    margin-bottom: 20px;
  }

  .info-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .info-row:last-child { border-bottom: none; }

  .info-label {
    font-size: 12px; font-weight: 500;
    color: var(--slate-text);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .info-value {
    font-size: 14px; font-weight: 600;
    color: var(--text-bright);
    font-family: 'JetBrains Mono', monospace;
  }
  .info-value.location { color: var(--amber); }
  .info-value.time { color: var(--green); }

  .photo-section {
    width: 100%;
    max-width: 340px;
    margin-bottom: 24px;
  }

  .photo-label {
    font-size: 11px; font-weight: 600;
    color: var(--slate-text);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
    text-align: left;
  }

  .photo-upload {
    width: 100%;
    height: 160px;
    border: 2px dashed rgba(255,255,255,0.1);
    border-radius: 12px;
    background: rgba(255,255,255,0.02);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    gap: 8px;
  }
  .photo-upload:active {
    background: rgba(255,255,255,0.04);
    border-color: rgba(245,158,11,0.2);
  }

  .photo-upload-icon {
    font-size: 36px;
    opacity: 0.6;
  }
  .photo-upload-text {
    font-size: 13px; color: var(--slate-text);
    font-weight: 500;
  }
  .photo-upload-hint {
    font-size: 11px; color: var(--slate-text);
    opacity: 0.6;
  }

  /* Fixed Bottom Action */
  .bottom-action {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 16px 20px 28px;
    background: linear-gradient(180deg, transparent, var(--navy));
    display: flex; flex-direction: column; gap: 12px;
    max-width: 430px;
    margin: 0 auto;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--amber) 0%, #d97706 100%);
    color: var(--navy-deep);
    border: none; border-radius: 12px;
    padding: 16px 24px;
    font-size: 15px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 16px var(--amber-glow);
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
    width: 100%;
  }
  .btn-primary:active { transform: scale(0.97); }

  .btn-secondary {
    background: transparent;
    color: var(--slate-text);
    border: none;
    padding: 12px;
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    text-align: center;
  }

  /* Ambient BG */
  body::before {
    content: '';
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(245,158,11,0.08) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }
  body > * { position: relative; z-index: 1; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <button class="back-btn">←</button>
  <div class="header-title">Check In</div>
  <div class="header-right"></div>
</div>

<!-- Main Content -->
<div class="main">
  <div class="status-icon">📍</div>
  <h1 class="main-title">Ready to Start?</h1>
  <p class="main-subtitle">Confirm your location and begin shift</p>

  <!-- Location & Time Info -->
  <div class="info-card">
    <div class="info-row">
      <span class="info-label">Location</span>
      <span class="info-value location">Gate 3 — Warehouse</span>
    </div>
    <div class="info-row">
      <span class="info-label">Scheduled Start</span>
      <span class="info-value time">09:00 AM</span>
    </div>
    <div class="info-row">
      <span class="info-label">Current Time</span>
      <span class="info-value">08:58 AM</span>
    </div>
    <div class="info-row">
      <span class="info-label">GPS Accuracy</span>
      <span class="info-value">±12 meters</span>
    </div>
  </div>

  <!-- Optional Site Photo -->
  <div class="photo-section">
    <div class="photo-label">Site Photo (Optional)</div>
    <div class="photo-upload">
      <div class="photo-upload-icon">📷</div>
      <div class="photo-upload-text">Tap to Capture</div>
      <div class="photo-upload-hint">Helps verify location</div>
    </div>
  </div>

</div>

<!-- Bottom Action -->
<div class="bottom-action">
  <button class="btn-primary">✓ Check In Now</button>
  <button class="btn-secondary">Report Issue with Location</button>
</div>

</body>
</html>
