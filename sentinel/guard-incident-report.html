<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SENTINEL — Report Incident</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --navy-deep: #0a0e1a;
    --navy: #111827;
    --slate: #1e293b;
    --slate-light: #334155;
    --slate-text: #94a3b8;
    --text: #e2e8f0;
    --text-bright: #f8fafc;
    --amber: #f59e0b;
    --amber-glow: rgba(245, 158, 11, 0.3);
    --red: #ef4444;
    --red-glow: rgba(239, 68, 68, 0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--navy-deep);
    color: var(--text);
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    overflow: hidden;
    max-width: 430px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    padding: 16px 20px 12px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(239,68,68,0.1);
  }
  .back-btn {
    width: 36px; height: 36px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    cursor: pointer;
    color: var(--text);
  }
  .header-title {
    font-size: 16px; font-weight: 600;
    color: var(--red);
    display: flex; align-items: center; gap: 8px;
  }
  .header-right { width: 36px; }

  /* Main Content */
  .main {
    flex: 1; overflow-y: auto;
    padding: 20px;
    display: flex; flex-direction: column; gap: 20px;
  }

  /* AI Prompt Card */
  .ai-prompt {
    background: linear-gradient(145deg, rgba(239,68,68,0.08) 0%, rgba(239,68,68,0.03) 100%);
    border: 1px solid rgba(239,68,68,0.15);
    border-radius: 12px;
    padding: 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .ai-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--amber) 0%, #d97706 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    box-shadow: 0 4px 12px var(--amber-glow);
  }
  .ai-text {
    flex: 1;
    font-size: 14px; font-weight: 500;
    color: var(--text);
    line-height: 1.4;
  }

  /* Voice Input Button */
  .voice-section {
    display: flex; flex-direction: column; align-items: center;
    gap: 12px;
  }
  .voice-btn {
    width: 140px; height: 140px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--red) 0%, #dc2626 100%);
    border: none;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 32px var(--red-glow);
    transition: all 0.2s;
    gap: 8px;
  }
  .voice-btn:active {
    transform: scale(0.95);
  }
  .voice-icon {
    font-size: 48px;
  }
  .voice-label {
    font-size: 11px; font-weight: 600;
    color: rgba(255,255,255,0.9);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  .voice-hint {
    font-size: 13px; color: var(--slate-text);
    text-align: center;
  }

  /* OR Divider */
  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 8px 0;
  }
  .divider-line {
    flex: 1; height: 1px;
    background: rgba(255,255,255,0.08);
  }
  .divider-text {
    font-size: 11px; font-weight: 600;
    color: var(--slate-text);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  /* Text Input */
  .input-section {
    display: flex; flex-direction: column; gap: 10px;
  }
  .input-label {
    font-size: 11px; font-weight: 600;
    color: var(--slate-text);
    text-transform: uppercase;
    letter-spacing: 1.2px;
  }
  .textarea {
    background: var(--slate);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 12px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    resize: none;
    height: 100px;
    outline: none;
  }
  .textarea::placeholder {
    color: var(--slate-text);
    opacity: 0.6;
  }
  .textarea:focus {
    border-color: rgba(239,68,68,0.2);
  }

  /* Quick Tags */
  .tags-section {
    display: flex; flex-direction: column; gap: 10px;
  }
  .tags-grid {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .tag-btn {
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    font-size: 12px; font-weight: 500;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.15s;
  }
  .tag-btn:active {
    background: rgba(239,68,68,0.1);
    border-color: rgba(239,68,68,0.2);
  }

  /* Photo Upload */
  .photo-section {
    display: flex; flex-direction: column; gap: 10px;
  }
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .photo-slot {
    aspect-ratio: 1;
    border: 2px dashed rgba(255,255,255,0.1);
    border-radius: 10px;
    background: rgba(255,255,255,0.02);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer;
    gap: 4px;
  }
  .photo-slot:active {
    background: rgba(255,255,255,0.04);
  }
  .photo-slot-icon {
    font-size: 24px;
    opacity: 0.4;
  }
  .photo-slot-text {
    font-size: 10px; color: var(--slate-text);
    opacity: 0.6;
  }

  /* Bottom Submit */
  .bottom-submit {
    padding: 16px 20px 28px;
    display: flex; flex-direction: column; gap: 10px;
    background: var(--navy);
    border-top: 1px solid rgba(255,255,255,0.04);
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--red) 0%, #dc2626 100%);
    color: white;
    border: none; border-radius: 12px;
    padding: 16px 24px;
    font-size: 15px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 16px var(--red-glow);
    font-family: 'Inter', sans-serif;
    width: 100%;
  }
  .btn-primary:active {
    transform: scale(0.97);
  }
  .btn-cancel {
    background: transparent;
    color: var(--slate-text);
    border: none;
    padding: 10px;
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    text-align: center;
  }

  /* Ambient BG */
  body::before {
    content: '';
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(239,68,68,0.06) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }
  body > * { position: relative; z-index: 1; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <button class="back-btn">←</button>
  <div class="header-title">🚨 Report Incident</div>
  <div class="header-right"></div>
</div>

<!-- Main Content -->
<div class="main">

  <!-- AI Prompt -->
  <div class="ai-prompt">
    <div class="ai-avatar">🤖</div>
    <div class="ai-text">
      <strong>I'm listening.</strong> Describe what happened — use your voice or type below.
    </div>
  </div>

  <!-- Voice Input -->
  <div class="voice-section">
    <button class="voice-btn">
      <div class="voice-icon">🎙️</div>
      <div class="voice-label">Tap to Speak</div>
    </button>
    <p class="voice-hint">Fastest way to report</p>
  </div>

  <!-- OR Divider -->
  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-text">or</span>
    <div class="divider-line"></div>
  </div>

  <!-- Text Input -->
  <div class="input-section">
    <label class="input-label">Type Details</label>
    <textarea class="textarea" placeholder="Describe what you saw, heard, or need to report..."></textarea>
  </div>

  <!-- Quick Tags -->
  <div class="tags-section">
    <label class="input-label">Category (Optional)</label>
    <div class="tags-grid">
      <button class="tag-btn">🚶 Trespassing</button>
      <button class="tag-btn">🚗 Vehicle Issue</button>
      <button class="tag-btn">🔒 Access Breach</button>
      <button class="tag-btn">🔥 Safety Hazard</button>
      <button class="tag-btn">👥 Suspicious Person</button>
      <button class="tag-btn">📦 Property Damage</button>
    </div>
  </div>

  <!-- Photo Upload -->
  <div class="photo-section">
    <label class="input-label">Add Photos (Optional)</label>
    <div class="photo-grid">
      <div class="photo-slot">
        <div class="photo-slot-icon">📷</div>
        <div class="photo-slot-text">Tap</div>
      </div>
      <div class="photo-slot">
        <div class="photo-slot-icon">📷</div>
        <div class="photo-slot-text">Tap</div>
      </div>
      <div class="photo-slot">
        <div class="photo-slot-icon">📷</div>
        <div class="photo-slot-text">Tap</div>
      </div>
    </div>
  </div>

</div>

<!-- Bottom Submit -->
<div class="bottom-submit">
  <button class="btn-primary">✓ Submit Report</button>
  <button class="btn-cancel">Cancel</button>
</div>

</body>
</html>
