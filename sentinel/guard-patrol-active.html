<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<parameter name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SENTINEL — Patrol Active</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --navy-deep: #0a0e1a;
    --navy: #111827;
    --slate: #1e293b;
    --slate-light: #334155;
    --slate-text: #94a3b8;
    --text: #e2e8f0;
    --text-bright: #f8fafc;
    --amber: #f59e0b;
    --amber-glow: rgba(245, 158, 11, 0.3);
    --green: #22c55e;
    --green-dim: rgba(34, 197, 94, 0.15);
    --blue: #3b82f6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--navy-deep);
    color: var(--text);
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    overflow: hidden;
    max-width: 430px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    padding: 16px 20px 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .status-badge {
    padding: 4px 10px;
    border-radius: 12px;
    background: var(--green-dim);
    border: 1px solid rgba(34,197,94,0.2);
    font-size: 10px; font-weight: 600;
    color: var(--green);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace;
  }
  .timer {
    font-size: 13px; font-weight: 600;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
  }

  /* Map Placeholder */
  .map-container {
    width: 100%;
    height: 240px;
    background: linear-gradient(135deg, #1a2332 0%, #0f1419 100%);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    position: relative;
    overflow: hidden;
  }
  .map-container::after {
    content: '🗺️ Map View';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 18px;
    color: var(--slate-text);
    opacity: 0.3;
  }
  .map-pin {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 32px; height: 32px;
    background: var(--amber);
    border-radius: 50%;
    box-shadow: 0 0 20px var(--amber-glow);
    animation: pinPulse 2s ease-in-out infinite;
  }
  @keyframes pinPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.1); }
  }

  /* Main Content */
  .main {
    flex: 1; overflow-y: auto;
    padding: 20px;
    display: flex; flex-direction: column; gap: 20px;
  }

  /* Current Checkpoint Card */
  .checkpoint-card {
    background: linear-gradient(145deg, var(--slate) 0%, var(--navy) 100%);
    border: 1px solid rgba(245,158,11,0.2);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .checkpoint-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 9px; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 10px;
    font-family: 'JetBrains Mono', monospace;
  }
  .checkpoint-badge-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--amber);
    animation: dotPulse 1.5s ease-in-out infinite;
  }
  @keyframes dotPulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

  .checkpoint-title {
    font-size: 22px; font-weight: 700;
    color: var(--text-bright);
    margin-bottom: 6px;
  }
  .checkpoint-location {
    font-size: 13px; color: var(--slate-text);
    margin-bottom: 16px;
  }

  .checkpoint-distance {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 600;
    color: var(--blue);
    margin-bottom: 20px;
  }

  .btn-scan {
    background: linear-gradient(135deg, var(--amber) 0%, #d97706 100%);
    color: var(--navy-deep);
    border: none; border-radius: 12px;
    padding: 14px 24px;
    font-size: 14px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 16px var(--amber-glow);
    width: 100%;
    font-family: 'Inter', sans-serif;
  }

  /* Progress Section */
  .progress-section {
    background: var(--slate);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 16px;
  }

  .progress-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .progress-label {
    font-size: 11px; font-weight: 600;
    color: var(--slate-text);
    text-transform: uppercase;
    letter-spacing: 1.2px;
  }
  .progress-count {
    font-size: 12px; font-weight: 600;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
  }

  .progress-bar-bg {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.06);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green) 0%, var(--amber) 100%);
    width: 50%;
    border-radius: 3px;
    transition: width 0.3s;
  }

  .checkpoint-list {
    display: flex; flex-direction: column; gap: 6px;
  }

  .checkpoint-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0;
  }
  .checkpoint-icon {
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    flex-shrink: 0;
  }
  .icon-complete {
    background: var(--green-dim);
    color: var(--green);
  }
  .icon-current {
    background: rgba(245,158,11,0.15);
    color: var(--amber);
  }
  .icon-pending {
    background: rgba(255,255,255,0.04);
    color: var(--slate-text);
  }

  .checkpoint-name {
    font-size: 13px; font-weight: 500;
    color: var(--text);
  }
  .checkpoint-name.complete {
    color: var(--slate-text);
    text-decoration: line-through;
  }
  .checkpoint-name.current {
    color: var(--text-bright);
    font-weight: 600;
  }

  /* Bottom Actions */
  .bottom-actions {
    padding: 16px 20px 28px;
    display: flex; gap: 10px;
    background: var(--navy);
    border-top: 1px solid rgba(255,255,255,0.04);
  }
  .btn-secondary {
    flex: 1;
    background: rgba(255,255,255,0.05);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 12px;
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .btn-emergency {
    background: rgba(239,68,68,0.1);
    border-color: rgba(239,68,68,0.2);
    color: #ef4444;
  }

  /* Ambient BG */
  body::before {
    content: '';
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(245,158,11,0.06) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }
  body > * { position: relative; z-index: 1; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <span class="status-badge">🚶 In Progress</span>
  </div>
  <div class="timer">⏱️ 12:34</div>
</div>

<!-- Map View -->
<div class="map-container">
  <div class="map-pin"></div>
</div>

<!-- Main Content -->
<div class="main">

  <!-- Current Checkpoint -->
  <div class="checkpoint-card">
    <div class="checkpoint-badge">
      <div class="checkpoint-badge-dot"></div>
      Checkpoint 2 of 4
    </div>
    <h2 class="checkpoint-title">East Loading Dock</h2>
    <p class="checkpoint-location">Zone B • Patrol Route A</p>
    <div class="checkpoint-distance">
      📍 18 meters away • 2 min walk
    </div>
    <button class="btn-scan">📱 Scan NFC Tag</button>
  </div>

  <!-- Progress Tracker -->
  <div class="progress-section">
    <div class="progress-header">
      <span class="progress-label">Route Progress</span>
      <span class="progress-count">2/4 Complete</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill"></div>
    </div>
    <div class="checkpoint-list">
      <div class="checkpoint-item">
        <div class="checkpoint-icon icon-complete">✓</div>
        <span class="checkpoint-name complete">Main Entrance</span>
      </div>
      <div class="checkpoint-item">
        <div class="checkpoint-icon icon-complete">✓</div>
        <span class="checkpoint-name complete">North Parking Lot</span>
      </div>
      <div class="checkpoint-item">
        <div class="checkpoint-icon icon-current">→</div>
        <span class="checkpoint-name current">East Loading Dock</span>
      </div>
      <div class="checkpoint-item">
        <div class="checkpoint-icon icon-pending">○</div>
        <span class="checkpoint-name">Rear Gate</span>
      </div>
    </div>
  </div>

</div>

<!-- Bottom Actions -->
<div class="bottom-actions">
  <button class="btn-secondary">📝 Add Note</button>
  <button class="btn-secondary">📷 Photo</button>
  <button class="btn-secondary btn-emergency">🚨 Alert</button>
</div>

</body>
</html>
